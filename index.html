<!DOCTYPE html>
<html>
    <head>
        <!-- Head: Things that are needed in the background to give more context to the site -->
        <title>Page Title</title>

        <!-- Meta tags are used for the search engine -->
        <meta name="description" content="This is my first website">
        <meta name="author" content="Jailyn M">
        <meta name="keywords" content="HTML, CSS, Learning">

        <!-- This meta tag encodes my characters and is used by the browser -->
        <meta charset="UTF-8">
    </head>
    <body>
        <!-- Body: The visible content of the page -->
        <header>
            <h1>Video Games</h1>
            <nav> </nav> <!-- navigation typically goes inside header -->
        </header>
        <main></main>
        <footer></footer>
    </body>
</html>
